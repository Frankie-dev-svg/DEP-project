<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShoeLand</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="logo">ShoeLand</div>
      <button class="connect">Connect now</button>
    </header>

    <main>
      <div class="content">
        <h1>Explore, find and shop<br>for the latest shoe</h1>
        <p class="subtext">Diverse selection of shoes with over 1,000 styles from top brands</p>
        <div class="cta-buttons">
          <button class="btn dark">Start shopping</button>
          <button class="btn light">Discover more</button>
        </div>
        <div class="stats">
          <div><strong>1K +</strong><p>Styles</p></div>
          <div><strong>500</strong><p>Brands</p></div>
          <div><strong>100K +</strong><p>Happy customers</p></div>
        </div>
      </div>

      <div class="product-card">
        <div class="product-image">
          <img src="Shoe.jpg" alt="shoe" />
        </div>
        <div class="product-info">
          <div class="info-blocks">
            <div>
              <span class="label">Featured</span>
              <span class="value">From</span>
            </div>
            <div>
              <span class="label">New arrivals</span>
              <span class="value">Limited stock</span>
            </div>
          </div>
          <div class="card-buttons">
            <button class="btn light">Shop now</button>
            <button class="btn light">View details</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
